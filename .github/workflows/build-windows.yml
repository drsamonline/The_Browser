name: Build Aetheris Browser (Windows Optimized)

on:
  push:
    branches: [ '**' ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest

    steps:
      - name: Checkout Repository (Shallow)
        uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 1

      - name: Setup MSVC Environment (Native Auto-Detect)
        id: msvc
        shell: cmd
        run: |
          @echo off
          echo === Locating Visual Studio ===
          for /f "tokens=*" %%i in ('"%ProgramFiles(x86)%\Microsoft Visual Studio\Installer\vswhere.exe" -latest -products * -requires Microsoft.Component.MSBuild -find VC\Auxiliary\Build\vcvarsall.bat') do set VCVARSALL=%%i
          
          if not defined VCVARSALL (
            echo ERROR: Visual Studio not found!
            exit /b 1
          )
          
          echo Found: %VCVARSALL%
          
          :: Clear any pre-set toolset versions that cause mismatches
          set VCToolsVersion=
          set VCToolsInstallDir=
          set WindowsSDKVersion=
          set WindowsSdkDir=
          
          echo === Initializing x64 environment (Latest Toolset) ===
          call "%VCVARSALL%" x64 -vcvars_ver=14.4
          
          if errorlevel 1 (
            echo Retrying with default toolset...
            call "%VCVARSALL%" x64
          )
          
          echo ::set-output name=has_msvc::true
          echo MSVC Ready. Cl version:
          cl

      - name: Install vcpkg (Fast Bootstrap)
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git
          cd vcpkg
          .\bootstrap-vcpkg.bat -disableMetrics
          .\vcpkg integrate install
        shell: pwsh

      - name: Configure CMake (Lightweight Build)
        run: |
          cmake -B build `
            -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE="${{ github.workspace }}/vcpkg/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=ON `
            -DLADYBIRD_ENABLE_VIDEO=OFF `
            -DLADYBIRD_ENABLE_WEB_AUDIO=OFF `
            -DLADYBIRD_ENABLE_PDF=OFF `
            -DLADYBIRD_ENABLE_SSL=OFF `
            -DLADYBIRD_ENABLE_WEBSOCKET=OFF `
            -DLADYBIRD_ENABLE_WEBGL=OFF
        shell: pwsh

      - name: Build Aetheris (MaxSpeed + LTO)
        run: |
          cmake --build build `
            --config Release `
            --target Ladybird `
            -- /m `
            /p:CL_MPcount=%NUMBER_OF_PROCESSORS% `
            /p:LinkTimeCodeGeneration=true `
            /p:Optimization=MaxSpeed `
            /p:InlineFunctionExpansion=AnySuitable `
            /p:FavorSizeOrSpeed=1
        shell: pwsh

      - name: Locate Executable
        id: find_exe
        run: |
          $exePath = Get-ChildItem -Path "build" -Recurse -Filter "Ladybird.exe" -File | Select-Object -First 1 -ExpandProperty FullName
          if ($exePath) {
            echo "exe_path=$exePath" >> $env:GITHUB_OUTPUT
            Write-Host "Found executable: $exePath"
          } else {
            Write-Error "Executable not found!"
            Get-ChildItem -Path "build" -Recurse -File -Filter "*.exe" | Select-Object FullName
            exit 1
          }
        shell: pwsh

      - name: Upload Aetheris Binary
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-browser-windows
          path: ${{ steps.find_exe.outputs.exe_path }}
          retention-days: 14
          compression-level: 9
          if-no-files-found: error

      - name: Upload Build Logs (If Failed)
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs-windows
          path: |
            build/CMakeFiles/CMakeOutput.log
            build/CMakeFiles/CMakeError.log
          retention-days: 7
