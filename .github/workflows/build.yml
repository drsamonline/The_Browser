name: Build Aetheris

on:
  push:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build-windows:
    name: Build Aetheris (Windows Hyper-Optimized)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup MSVC Developer Command Prompt
        uses: ilammy/msvc-dev-cmd@v1.9

      - name: Install vcpkg and Dependencies
        run: |
          git clone https://github.com/microsoft/vcpkg.git
          cd vcpkg
          ./bootstrap-vcpkg.bat -disableMetrics
          ./vcpkg install lz4:x64-windows nlohmann-json:x64-windows --no-downloads || ./vcpkg install lz4:x64-windows nlohmann-json:x64-windows
        shell: cmd

      - name: Configure CMake (Hyper-Optimized)
        run: |
          cmake -B build -S . `
            -G "Visual Studio 17 2022" `
            -A x64 `
            -DCMAKE_TOOLCHAIN_FILE=vcpkg/scripts/buildsystems/vcpkg.cmake `
            -DCMAKE_BUILD_TYPE=Release `
            -DCMAKE_INTERPROCEDURAL_OPTIMIZATION=TRUE `
            -DLADYBIRD_ENABLE_WEBGPU=OFF `
            -DLADYBIRD_ENABLE_WASM=OFF `
            -DLADYBIRD_ENABLE_MEDIA_FOUNDATION=OFF `
            -DLADYBIRD_ENABLE_PDF=OFF `
            -DCMAKE_CXX_FLAGS="/O2 /GL /GR- /EHs-c- /Qpar" `
            -DCMAKE_EXE_LINKER_FLAGS="/OPT:REF /OPT:ICF /LTCG"
        shell: pwsh

      - name: Build Aetheris
        run: cmake --build build --config Release --parallel %NUMBER_OF_PROCESSORS%
        shell: cmd

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-browser-win-x64
          path: |
            build/Release/Ladybird.exe
            build/Release/aetheris.exe
            build/Release/*.dll
          if-no-files-found: warn
