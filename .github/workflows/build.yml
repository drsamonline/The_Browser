name: Build Aetheris

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aetheris-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/Build/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/Build/caches/vcpkg-binary-cache,readwrite
  X_VCPKG_ASSET_SOURCES: clear;x-azurl,https://vcpkg-cache.app.ladybird.org/ladybird/source-assets/

jobs:
  build-windows:
    name: Build Aetheris (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Restore Aetheris dependency cache
        uses: actions/cache@v4
        with:
          path: |
            Build/caches
            Build/vcpkg/downloads
            Build/vcpkg/packages
            Build/vcpkg/installed
          key: aetheris-vcpkg-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json', 'Meta/CMake/vcpkg/**', 'Meta/CMake/presets/**') }}
          restore-keys: |
            aetheris-vcpkg-windows-x64-

      - name: Bootstrap repository-local vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Build | Out-Null
          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT
            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics
          }

      - name: Prime HSTS preload data
        shell: pwsh
        run: |
          $hstsDir = Join-Path $env:GITHUB_WORKSPACE 'Build/caches/HSTSPreload'
          $hstsPath = Join-Path $hstsDir 'transport_security_state_static.json'
          New-Item -ItemType Directory -Force -Path $hstsDir | Out-Null
          if (-not (Test-Path $hstsPath)) {
            Invoke-WebRequest `
              -Uri 'https://raw.githubusercontent.com/chromium/chromium/main/net/http/transport_security_state_static.json' `
              -OutFile $hstsPath
          }

      - name: Initialize and verify MSVC environment
        shell: pwsh
        run: |
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          if (-not (Test-Path $vsWhere)) {
            Write-Error "vswhere.exe was not found. Visual Studio Build Tools is required."
          }
          $vsPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "No Visual Studio installation with MSVC x64 tools was found."
          }
          $vsDevCmd = Join-Path $vsPath 'Common7/Tools/VsDevCmd.bat'
          if (-not (Test-Path $vsDevCmd)) {
            Write-Error "VsDevCmd.bat was not found at $vsDevCmd"
          }
          cmd /c "call `"$vsDevCmd`" -arch=x64 && where cl && where link && cl" 

      - name: Configure Release
        shell: pwsh
        run: |
          $env:LADYBIRD_SOURCE_DIR = (Get-Location).Path

          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'
          $vsPath = & $vsWhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) {
            Write-Error "No Visual Studio installation with MSVC x64 tools was found."
          }

          $vsDevCmd = Join-Path $vsPath 'Common7/Tools/VsDevCmd.bat'

          cmd /c "call `"$vsDevCmd`" -arch=x64 && where cl && where link && where ml64 && cmake --preset MSVC-Release"
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build Build/release --config RelWithDebInfo --parallel

      - name: Test Release
        shell: pwsh
        run: |
          ctest --test-dir Build/release -C RelWithDebInfo --output-on-failure

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $executables = Get-ChildItem -Path Build/release -Recurse -Filter *.exe -File |
            Where-Object { $_.FullName -notmatch '[\\/]CMakeFiles[\\/]' }
          if (-not $executables) {
            Write-Error 'No Windows executables were produced by the build.'
          }
          $executables | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path 'dist' $_.Name) -Force
          }
          Compress-Archive -Path dist/* -DestinationPath aetheris-windows-x64.zip -Force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-windows-x64-${{ github.sha }}
          path: aetheris-windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aetheris-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
