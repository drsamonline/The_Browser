name: Build Aetheris

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: write

concurrency:
  group: aetheris-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-windows:
    name: Build Aetheris (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup Visual Studio
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      - name: Install vcpkg
        shell: pwsh
        run: |
          git clone --depth 1 https://github.com/microsoft/vcpkg.git Build/vcpkg
          & Build/vcpkg/bootstrap-vcpkg.bat -disableMetrics

      - name: Configure Release
        shell: pwsh
        run: |
          $env:LADYBIRD_SOURCE_DIR = (Get-Location).Path
          $env:VCPKG_ROOT = Join-Path $env:LADYBIRD_SOURCE_DIR 'Build/vcpkg'
          cmake --preset Release

      - name: Build Release
        shell: pwsh
        run: |
          cmake --build Build/release --config RelWithDebInfo --parallel

      - name: Test Release
        shell: pwsh
        run: |
          ctest --test-dir Build/release -C RelWithDebInfo --output-on-failure

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null
          $executables = Get-ChildItem -Path Build/release -Recurse -Filter *.exe -File
          if (-not $executables) {
            Write-Error 'No Windows executables were produced by the build.'
          }
          $executables | ForEach-Object {
            Copy-Item $_.FullName -Destination (Join-Path 'dist' $_.Name) -Force
          }
          Compress-Archive -Path dist/* -DestinationPath aetheris-windows-x64.zip -Force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v4
        with:
          name: aetheris-windows-x64-${{ github.sha }}
          path: aetheris-windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aetheris-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
