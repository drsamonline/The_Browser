name: Build Aetheris

on:
  push:
    branches: [ "main" ]
    tags:
      - "v*"
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: aetheris-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  VCPKG_ROOT: ${{ github.workspace }}/Build/vcpkg
  VCPKG_BINARY_SOURCES: clear;files,${{ github.workspace }}/Build/caches/vcpkg-binary-cache,readwrite
  # NOTE: X_VCPKG_ASSET_SOURCES is intentionally not set. Aetheris does not
  # reuse Ladybird's private asset cache; vcpkg falls back to upstream
  # sources for downloads. Restore this only if an Aetheris-hosted mirror
  # is provisioned.

jobs:
  # Fast, dependency-light validation of the Aetheris-specific code in src/
  # (AetherisRendering + AetherisRuntime + the `aetheris` executable) and its
  # CTest suite. This job uses the AETHERIS_STANDALONE_BUILD profile, which
  # skips the full Ladybird-derived tree (AK/Libraries/Services/UI need a
  # complete vcpkg manifest that cannot resolve on bare runners). It needs
  # only system dev packages, giving pull requests quick signal.
  test-standalone:
    name: Test Aetheris standalone (Linux)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build pkg-config g++ libx11-dev liblz4-dev libedit-dev uuid-dev

      - name: Configure
        run: >
          cmake -S . -B build-standalone -G Ninja -DCMAKE_BUILD_TYPE=Debug
          -DAETHERIS_STANDALONE_BUILD=ON
          -DAETHERIS_ENABLE_TESTING=ON
          -DBUILD_TESTING=ON

      - name: Build
        run: cmake --build build-standalone --parallel

      - name: Test
        run: ctest --test-dir build-standalone --output-on-failure --no-tests=error

      # Headless smoke run: `--smoke-test` initializes every subsystem, runs
      # a bounded frame loop and exits 0. No xvfb needed - the binary works
      # both with the X11 backend (graceful fallback when no display exists)
      # and the headless backend (when libX11 dev packages are absent).
      - name: Smoke-run the aetheris executable
        run: ./build-standalone/bin/aetheris --smoke-test

  # Fast MSVC-based validation of the Aetheris targets on Windows WITHOUT the
  # multi-hour vcpkg bootstrap (the standalone profile has no hard external
  # deps: LZ4 and the UI layer fall back to bundled shims when not found).
  # This gives PRs quick Windows signal and catches platform-specific breakage
  # long before the expensive full-tree Release job runs.
  test-windows-standalone:
    name: Test Aetheris standalone (Windows)
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - name: Add MSVC to PATH
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Configure
        shell: pwsh
        run: |
          cmake -S . -B build-standalone -G "Ninja Multi-Config" `
            -DAETHERIS_STANDALONE_BUILD=ON `
            -DAETHERIS_ENABLE_TESTING=ON `
            -DBUILD_TESTING=ON `
            -DCMAKE_C_COMPILER=cl `
            -DCMAKE_CXX_COMPILER=cl

      - name: Build
        run: cmake --build build-standalone --config Debug --parallel

      - name: Test
        run: ctest --test-dir build-standalone -C Debug --output-on-failure --no-tests=error

      - name: Smoke-run the aetheris executable
        run: ./build-standalone/bin/Debug/aetheris.exe --smoke-test

  # Full-tree Windows build (vcpkg manifest + clang-cl). Expensive: it only
  # runs on main pushes, tags, and manual dispatches - NOT on every PR - so
  # pull-request latency stays low. The vcpkg caches below make repeat runs
  # incremental instead of bootstrapping every dependency from source.
  build-windows:
    name: Build Aetheris (Windows)
    if: github.event_name == 'push' || github.event_name == 'workflow_dispatch'
    runs-on: windows-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
          submodules: recursive

      - name: Setup MSBuild
        uses: microsoft/setup-msbuild@v2

      - name: Setup CMake
        uses: lukka/get-cmake@latest

      # Binary cache keyed ONLY on the dependency manifests (not on the whole
      # Meta/CMake tree), so ordinary source changes never invalidate it.
      - name: Restore vcpkg binary cache
        uses: actions/cache/restore@v4
        with:
          path: Build/caches/vcpkg-binary-cache
          key: aetheris-vcpkg-bin-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            aetheris-vcpkg-bin-windows-x64-

      # Installed-tree cache: lets vcpkg skip re-planning and lets CMake reuse
      # already-built ports even when a partial binary-cache miss occurs.
      - name: Restore vcpkg installed tree
        uses: actions/cache/restore@v4
        with:
          path: |
            Build/vcpkg/downloads
            Build/vcpkg/packages
            Build/vcpkg/installed
          key: aetheris-vcpkg-tree-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}
          restore-keys: |
            aetheris-vcpkg-tree-windows-x64-

      - name: Bootstrap repository-local vcpkg
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path Build | Out-Null

          if (-not (Test-Path "$env:VCPKG_ROOT/vcpkg.exe")) {
            git clone https://github.com/microsoft/vcpkg.git $env:VCPKG_ROOT

            & "$env:VCPKG_ROOT/bootstrap-vcpkg.bat" -disableMetrics

            if ($LASTEXITCODE -ne 0) {
              exit $LASTEXITCODE
            }
          }

      - name: Prime HSTS preload data
        shell: pwsh
        run: |
          $hstsDir = Join-Path $env:GITHUB_WORKSPACE 'Build/caches/HSTSPreload'
          $hstsPath = Join-Path $hstsDir 'transport_security_state_static.json'

          New-Item -ItemType Directory -Force -Path $hstsDir | Out-Null

          if (-not (Test-Path $hstsPath)) {
            Invoke-WebRequest `
              -Uri 'https://raw.githubusercontent.com/chromium/chromium/main/net/http/transport_security_state_static.json' `
              -OutFile $hstsPath
          }

      - name: Initialize Visual Studio environment
        shell: pwsh
        run: |
          $vsWhere = Join-Path ${env:ProgramFiles(x86)} 'Microsoft Visual Studio/Installer/vswhere.exe'

          if (-not (Test-Path $vsWhere)) {
            Write-Error "vswhere.exe was not found."
            exit 1
          }

          $vsPath = & $vsWhere `
            -latest `
            -products * `
            -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 `
            -property installationPath

          if (-not $vsPath) {
            Write-Error "No Visual Studio installation with MSVC x64 tools was found."
            exit 1
          }

          $vsDevCmd = Join-Path $vsPath 'Common7/Tools/VsDevCmd.bat'

          if (-not (Test-Path $vsDevCmd)) {
            Write-Error "VsDevCmd.bat was not found at $vsDevCmd"
            exit 1
          }

          # Only propagate the variables CMake actually needs from VsDevCmd.
          # Dumping the full `set` output into GITHUB_ENV previously polluted
          # every later step (PATH bloat, clashing toolchain env vars) and is
          # what made configure/build behave differently between steps.
          $wanted = @(
            'VSCMD_ARG_TGT_ARCH',
            'Platform',
            'WindowsSdkDir',
            'WindowsSDKVersion',
            'UCRTVersion',
            'VSINSTALLDIR',
            'VCINSTALLDIR',
            'VCToolsInstallDir',
            'VCToolsRedistDir'
          )

          $envDump = cmd /c "`"$vsDevCmd`" -arch=x64 -no_logo && set"

          if ($LASTEXITCODE -ne 0) {
            Write-Error "VsDevCmd.bat failed."
            exit $LASTEXITCODE
          }

          foreach ($line in $envDump) {
            if ($line -match '^([^=]+)=(.*)$' -and $wanted -contains $matches[1]) {
              "$($matches[1])=$($matches[2])" | Out-File `
                -FilePath $env:GITHUB_ENV `
                -Encoding utf8 `
                -Append
            }
          }

          Write-Host "Visual Studio installation: $vsPath"

      - name: Locate clang-cl
        id: clang
        shell: pwsh
        run: |
          $candidates = @(
            (Join-Path $env:VCToolsInstallDir 'bin\Hostx64\x64\clang-cl.exe'),
            'C:\Program Files\LLVM\bin\clang-cl.exe'
          )

          $clangCl = $null
          foreach ($candidate in $candidates) {
            if ($candidate -and (Test-Path $candidate)) {
              $clangCl = $candidate
              break
            }
          }

          if (-not $clangCl) {
            $clangCommand = Get-Command clang-cl.exe -ErrorAction SilentlyContinue
            if ($clangCommand) {
              $clangCl = $clangCommand.Source
            }
          }

          if (-not $clangCl) {
            Write-Error "clang-cl.exe was not found on the Windows runner."
            exit 1
          }

          $llvmBin = Split-Path $clangCl -Parent
          $llvmBin | Out-File -FilePath $env:GITHUB_PATH -Encoding utf8 -Append

          "path=$clangCl" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

          & $clangCl --version
          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      # Use explicit cmake flags instead of `cmake --preset Release`: the
      # preset pins the Ninja generator while the build step used
      # `--config RelWithDebInfo` (a multi-config concept), so configure and
      # build disagreed about the build tree and the step failed. Writing the
      # cache directly also avoids preset/env drift between steps.
      - name: Configure Release
        shell: pwsh
        run: |
          $env:LADYBIRD_SOURCE_DIR = $env:GITHUB_WORKSPACE

          New-Item -ItemType Directory -Force -Path Build | Out-Null

          if (Test-Path "Build/release/CMakeCache.txt") {
            Remove-Item "Build/release/CMakeCache.txt" -Force
          }

          cmake -S . -B Build/release -G "Ninja Multi-Config" `
            -DCMAKE_TOOLCHAIN_FILE="$env:VCPKG_ROOT/scripts/buildsystems/vcpkg.cmake" `
            -DCMAKE_BUILD_TYPE=RelWithDebInfo `
            -DCMAKE_C_COMPILER=clang-cl `
            -DCMAKE_CXX_COMPILER=clang-cl `
            -DAETHERIS_WINDOWS_LINKER_MODE=SYSTEM `
            -DVCPKG_OVERLAY_TRIPLETS="$env:GITHUB_WORKSPACE/Meta/CMake/vcpkg/release-triplets" `
            -DLADYBIRD_CACHE_DIR="$env:GITHUB_WORKSPACE/Build/caches"

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

          if (-not (Test-Path "Build/release/CMakeCache.txt")) {
            Write-Error "CMakeCache.txt was not generated."
            exit 1
          }

      - name: Verify clang-cl toolchain
        shell: pwsh
        run: |
          Write-Host "===== clang-cl toolchain verification ====="

          $cache = Get-Content "Build/release/CMakeCache.txt"

          $compilerLine = $cache |
            Where-Object { $_ -match '^CMAKE_CXX_COMPILER:.*=' } |
            Select-Object -First 1

          if (-not $compilerLine) {
            Write-Error "CMAKE_CXX_COMPILER entry was not found in CMakeCache.txt."
            exit 1
          }

          Write-Host "CMake CXX compiler:"
          Write-Host $compilerLine

          if ($compilerLine -notmatch 'clang-cl') {
            Write-Error "CMake CXX compiler is not clang-cl."
            exit 1
          }

          Write-Host "clang-cl toolchain verification successful."

      - name: Build Release
        shell: pwsh
        run: |
          # Single-config semantics: the configure step sets
          # CMAKE_BUILD_TYPE=RelWithDebInfo, so do NOT pass --config here
          # (passing it to a single-config generator is ignored/error-prone
          # and caused outputs to be looked for in the wrong directory).
          cmake --build Build/release --parallel

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Test Release
        shell: pwsh
        run: |
          # --no-tests=error: the Windows release build must register tests;
          # if none are found, something is wrong with the test wiring and CI
          # should fail loudly instead of silently passing.
          ctest --test-dir Build/release --output-on-failure --no-tests=error

          if ($LASTEXITCODE -ne 0) {
            exit $LASTEXITCODE
          }

      - name: Save vcpkg binary cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: Build/caches/vcpkg-binary-cache
          key: aetheris-vcpkg-bin-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}

      - name: Save vcpkg installed tree cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            Build/vcpkg/downloads
            Build/vcpkg/packages
            Build/vcpkg/installed
          key: aetheris-vcpkg-tree-windows-x64-${{ hashFiles('vcpkg.json', 'vcpkg-configuration.json') }}-${{ github.run_id }}

      - name: Package Windows build
        shell: pwsh
        run: |
          New-Item -ItemType Directory -Force -Path dist | Out-Null

          $executables = Get-ChildItem `
            -Path Build/release `
            -Recurse `
            -Filter *.exe `
            -File |
            Where-Object {
              $_.FullName -notmatch '[\\/]CMakeFiles[\\/]'
            }

          if (-not $executables) {
            Write-Error 'No Windows executables were produced by the build.'
            exit 1
          }

          $executables | ForEach-Object {
            Copy-Item `
              $_.FullName `
              -Destination (Join-Path 'dist' $_.Name) `
              -Force
          }

          Compress-Archive `
            -Path dist/* `
            -DestinationPath aetheris-windows-x64.zip `
            -Force

      - name: Upload CI artifact
        uses: actions/upload-artifact@v7
        with:
          name: aetheris-windows-x64-${{ github.sha }}
          path: aetheris-windows-x64.zip
          if-no-files-found: error

      - name: Publish tagged release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: aetheris-windows-x64.zip
          generate_release_notes: true
          fail_on_unmatched_files: true
